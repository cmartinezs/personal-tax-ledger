name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run architecture:check
      # tsc -b en web/ tiene errores preexistentes documentados en
      # docs/gaps/2026-08-06-tsc-web.md; se corre en modo informativo
      # hasta que se resuelvan en una tarea separada.
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run build:packages
      - run: npm run test:workspaces
      - run: npm run pack:smoke
      - run: npm run smoke:local
      - run: npm run validate:pack-a
