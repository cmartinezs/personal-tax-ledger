name: CI

on:
  push:
  pull_request:

jobs:
  platform:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run architecture:check
      - run: npm test
      - run: npm run test:workspaces
      - run: npm run build:packages
      - run: npm run pack:smoke
      - run: npm run smoke:local

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm --workspace @personal-tax-ledger/local-web run build
      - run: npm run architecture:check
      - run: npm run test:external-consumer
      - run: npm run pack:smoke

  architecture-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run architecture:check
      - run: npm test
      - run: npm run test:workspaces
      - run: npm run build:packages
      - run: npm run test:external-consumer
      - run: npm run pack:smoke

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test:external-consumer
      - run: npm run pack:smoke

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run smoke:local
      - run: npm run architecture:check
